    | int - 1] if channel | int in [1,2,3,4] else 0 }}'
  numeric_step: '{{ ([b1_numeric_step, b2_numeric_step, b3_numeric_step, b4_numeric_step] if hardware_mode == "blue"
    else [c1_numeric_step, c2_numeric_step, c3_numeric_step, c4_numeric_step])[channel | int - 1] if channel | int
    in [1,2,3,4] else 0 }}'
  reverse: '{{ ([b1_reverse, b2_reverse, b3_reverse, b4_reverse] if hardware_mode == "blue" else [c1_reverse, c2_reverse,
