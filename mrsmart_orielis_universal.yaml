conditions:
- condition: template
  value_template: '{{ enabled and channel | int in [1,2,3,4] }}'
actions:
- choose:
  - conditions: '{{ action_id == "light_1_on" and not channel_1_on_enabled }}'
    sequence:
    - stop: This event is disabled
  - conditions: '{{ action_id == "light_1_on" and custom_1_on | length > 0 }}'
    sequence:
    - sequence: !input 'channel_1_custom_press'
    - stop: Custom override completed
