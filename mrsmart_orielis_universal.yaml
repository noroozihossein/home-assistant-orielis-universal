      and "color_temp" in (state_attr(entity,"supported_color_modes") or []) and state_attr(entity,"min_color_temp_kelvin")
      is number and state_attr(entity,"max_color_temp_kelvin") is number and (is_state(entity,"on") or wake_lights))
      | bool %}

      {% set ns.members = ns.members + [entity] %}

      {% set ns.lows = ns.lows + [state_attr(entity,''min_color_temp_kelvin'') | float] %}{% set ns.highs = ns.highs
      + [state_attr(entity,''max_color_temp_kelvin'') | float] %}

      {% endif %}{% endfor %}{% endif %}

      {% if ns.members | length > 0 %}

      {% set entity = ns.members[0] %}

      {% set lo = ns.lows | max if ns.lows else 0 %}

      {% set hi = ns.highs | min if ns.highs else 0 %}

      {% if lo <= hi %}

      {% set cur = state_attr(entity,''color_temp_kelvin'') | float(0) %}{% if cur <= 0 %}{% set m = state_attr(entity,''color_temp'')
      | float(0) %}{% set cur = 1000000 / m if m > 0 else (lo+hi)/2 %}{% endif %}

      {% set value = [lo, [hi, cur + (cct_step | float * direction | int)] | min] | max %}

      {{ dict(valid=true, members=ns.members, value=value | round(0) | int) }}

      {% else %}{{ dict(valid=false, members=ns.members) }}{% endif %}

      {% else %}{{ dict(valid=false, members=[]) }}{% endif %}'
