blueprint:
  source_url: https://github.com/noroozihossein/home-assistant-orielis-universal/blob/main/mrsmart_orielis_universal.yaml
  name: Mr Smart — Orielis Three-Mode Universal Controller v0.3.0
  description: 'Mode 1 GREEN and Mode 2 BLUE each have four independent universal profiles; Scene RED has four independent
    action buttons and no rotation. Select control type first, then targets, grouping, steps and optional custom
    overrides. The remote selects its hardware mode; this blueprint routes each actual event automatically. No helpers
    or fixed Zigbee group IDs. Synchronized uses the first eligible target as reference per property and common
    member limits; Relative preserves individual levels. Mixed domains are handled separately. Off lights remain
    excluded from rotation unless wake_lights is enabled. Custom actions override automatic handling. Green on/off
    and Blue start/stop map to audio play/pause; Blue cover start/stop maps to open/STOP. Climate built-ins adjust
    a single setpoint; use custom actions for HVAC modes/power. Numerical target resolution may affect reported
    values. Play/pause commands do not create multiroom clock or track synchronization. One automation per remote.
    Migration from v0.2.1: existing targets/steps/grouping belong to GREEN; BLUE targets start empty and must be
    selected separately. Existing event-specific overrides and RED actions keep their IDs. Supports only commands
    actually sent by the remote. The tested device required initial setup on a Tuya hub before light/curtain commands
    worked; this is not proven universal. Software-tested release; confirm hardware behavior before publication.'
  domain: automation
  author: Mr Smart
  homeassistant:
    min_version: 2024.12.5
  input:
    connection:
      name: Controller
      icon: mdi:knob
      input:
        orielis_device:
          name: Orielis remote
          description: Select the Orielis TS0601 device. Create one automation per remote.
          selector:
            device:
              filter:
              - integration: mqtt
              multiple: false
        enabled:
          name: Enabled
          default: true
          selector:
            boolean: {}
        wake_lights:
          name: Rotation may turn on an off light
          default: false
          selector:
            boolean: {}
        event_cooldown:
          name: Minimum interval after an event (seconds)
          description: Drops input during this brief interval; prevents a queue of old rotations. Increase if the
            target reports slowly.
          default: 0.15
          selector:
            number:
              min: 0
              max: 2
              step: 0.05
              mode: box
    green_1:
      name: Mode 1 — GREEN LED — Channel 1 (top / 12)
      description: Independent green profile. Hardware mode names do not restrict the target category. On/off =
        light power / audio play-pause / cover open-close. Normal rotation uses the selected function; colortemp
        events control CCT / audio tracks.
      collapsed: true
      input:
        channel_1_usage:
          name: Control type
          description: Choose a target category, or Automatic / mixed to dispatch by entity domain. Custom actions
            bypass automatic control. Climate defaults change a single target temperature only; assign power/mode
            actions explicitly if needed.
          default: auto
          selector:
            select:
              options:
              - label: Automatic / mixed targets
                value: auto
              - label: Lighting
                value: light
              - label: Audio / music
                value: media_player
              - label: Curtains / blinds
                value: cover
              - label: Climate setpoint
                value: climate
              - label: Numeric controls
                value: numeric
              - label: Custom actions only
                value: custom
        channel_1_targets:
          name: Targets
          description: Any combination of lights, media players, covers, climate or number entities.
          default: []
          selector:
            entity:
              filter:
              - domain: light
              - domain: media_player
              - domain: cover
              - domain: climate
              - domain: number
              - domain: input_number
              multiple: true
        channel_1_group_mode:
          name: Group mode — Synchronized / Relative
          description: 'Synchronized: same requested level per property, using the first eligible target as reference.
            Relative: adjust each target from its own level. Selection applies only to this channel.'
          default: relative
          selector:
            select:
              options:
              - label: Synchronized — common level
                value: synchronized
              - label: Relative — individual levels
                value: relative
        channel_1_brightness_step:
          name: Brightness step
          default: 5
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: box
              unit_of_measurement: '%'
        channel_1_cct_step:
          name: CCT step (Kelvin)
          default: 150
          selector:
            number:
              min: 25
              max: 2000
              step: 25
              mode: box
              unit_of_measurement: K
        channel_1_volume_step:
          name: Volume step
          default: 5
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: box
              unit_of_measurement: '%'
        channel_1_cover_step:
          name: Cover-position step
          default: 10
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: box
              unit_of_measurement: '%'
        channel_1_temperature_step:
          name: Climate temperature step
          default: 0.5
          selector:
            number:
              min: 0.1
              max: 10
              step: 0.1
              mode: box
        channel_1_numeric_step:
          name: Number step
          default: 1
          selector:
            number:
              min: 0.01
              max: 1000
              step: 0.01
              mode: box
        channel_1_reverse:
          name: Reverse increase/decrease direction
          default: false
          selector:
            boolean: {}
        channel_1_rotation:
          name: Rotation function
          description: Select what normal rotation controls. The separate colortemp gesture remains CCT / next-previous
            track. Custom overrides use the original event names.
          default: primary
          selector:
            select:
              options:
              - label: Primary level control
                value: primary
              - label: Secondary — CCT / audio tracks
                value: secondary
        channel_1_custom_press:
          name: On — custom actions
          description: Optional override. Leave empty for automatic handling.
          default: []
          selector:
            action: {}
        channel_1_on_enabled:
          name: On — enabled
          default: true
          selector:
            boolean: {}
        channel_1_custom_off:
          name: Off — custom actions
          description: Optional override. Leave empty for automatic handling.
          default: []
          selector:
            action: {}
        channel_1_off_enabled:
          name: Off — enabled
          default: true
          selector:
            boolean: {}
        channel_1_custom_brightness_up:
          name: Brightness Up — custom actions
          description: Optional override. Leave empty for automatic handling.
          default: []
          selector:
            action: {}
        channel_1_brightness_up_enabled:
          name: Brightness Up — enabled
          default: true
          selector:
            boolean: {}
        channel_1_custom_brightness_down:
          name: Brightness Down — custom actions
          description: Optional override. Leave empty for automatic handling.
          default: []
          selector:
            action: {}
        channel_1_brightness_down_enabled:
          name: Brightness Down — enabled
          default: true
          selector:
            boolean: {}
        channel_1_custom_colortemp_up:
          name: Colortemp Up — custom actions
          description: Optional override. Leave empty for automatic handling.
          default: []
          selector:
            action: {}
        channel_1_colortemp_up_enabled:
          name: Colortemp Up — enabled
          default: true
          selector:
            boolean: {}
        channel_1_custom_colortemp_down:
          name: Colortemp Down — custom actions
          description: Optional override. Leave empty for automatic handling.
          default: []
          selector:
