      {% set entity = ns.members[0] %}

      {% set lo = ns.lows | max if ns.lows else 0 %}

      {% set hi = ns.highs | min if ns.highs else 1 %}

      {% if lo <= hi %}

      {% set cur = state_attr(entity,''volume_level'') | float %}

      {% set value = [lo, [hi, cur + (volume_step | float / 100 * direction | int)] | min] | max %}

      {{ dict(valid=true, members=ns.members, value=value) }}

      {% else %}{{ dict(valid=false, members=ns.members) }}{% endif %}

