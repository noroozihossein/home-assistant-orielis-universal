    c2_targets, c3_targets, c4_targets])[channel | int - 1] if channel | int in [1,2,3,4] else [] }}'
  group_mode: '{{ ([b1_group_mode, b2_group_mode, b3_group_mode, b4_group_mode] if hardware_mode == "blue" else
    [c1_group_mode, c2_group_mode, c3_group_mode, c4_group_mode])[channel | int - 1] if channel | int in [1,2,3,4]
    else 0 }}'
  brightness_step: '{{ ([b1_brightness_step, b2_brightness_step, b3_brightness_step, b4_brightness_step] if hardware_mode
    == "blue" else [c1_brightness_step, c2_brightness_step, c3_brightness_step, c4_brightness_step])[channel | int
