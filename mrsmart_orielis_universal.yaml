  usage: '{{ ([b1_usage, b2_usage, b3_usage, b4_usage] if hardware_mode == "blue" else [c1_usage, c2_usage, c3_usage,
    c4_usage])[channel | int - 1] if channel | int in [1,2,3,4] else 0 }}'
  rotation: '{{ ([b1_rotation, b2_rotation, b3_rotation, b4_rotation] if hardware_mode == "blue" else [c1_rotation,
    c2_rotation, c3_rotation, c4_rotation])[channel | int - 1] if channel | int in [1,2,3,4] else 0 }}'
  targets: '{% set ns = namespace(ids=[]) %}{% for e in selected_targets %}{% set dom=e.split(''.'')[0] %}{% if
    usage == ''auto'' or usage == dom or (usage == ''numeric'' and dom in [''number'',''input_number'']) %}{% set
    ns.ids=ns.ids+[e] %}{% endif %}{% endfor %}{{ ns.ids if hardware_mode != ''red'' else [] }}'
  raw_operation: '{{ action_id.split("_",2)[2] if action_id.startswith(("light_", "curtain_")) else "scene" }}'
  operation: '{% set op = raw_operation %}{% if hardware_mode == ''blue'' %}{% set op = {''start'':''on'',''stop'':''off'',''position_open'':''brightness_up'',''position_close'':''brightness_down''}.get(op,op)
    %}{% endif %}{% if rotation == ''secondary'' and op in [''brightness_up'',''brightness_down''] %}{% set op=op.replace(''brightness'',''colortemp'')
    %}{% endif %}{{ op }}'
  direction: '{{ (-1 if operation in ["brightness_down", "colortemp_down", "position_close"] else 1) * (-1 if reverse
    else 1) }}'
