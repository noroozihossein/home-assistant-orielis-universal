      {% set entity = ns.members[0] %}

      {% set lo = ns.lows | max if ns.lows else 0 %}

      {% set hi = ns.highs | min if ns.highs else 100 %}

      {% if lo <= hi %}

      {% set cur = state_attr(entity,''current_position'') | float %}

      {% set value = [lo, [hi, cur + (cover_step | float * direction | int)] | min] | max %}

      {{ dict(valid=true, members=ns.members, value=value | round(0) | int) }}

      {% else %}{{ dict(valid=false, members=ns.members) }}{% endif %}

      {% else %}{{ dict(valid=false, members=[]) }}{% endif %}'
    sync_temperature: '{% set ns = namespace(members=[], lows=[], highs=[]) %}

      {% if group_mode == ''synchronized'' %}

      {% for entity in targets | unique | list %}

      {% set domain = entity.split(''.'')[0] %}

      {% set features = state_attr(entity,''supported_features'') | int(0) %}

      {% set adjustable = ((state_attr(entity,''supported_color_modes'') or []) | reject(''equalto'',''onoff'')
      | reject(''equalto'',''unknown'') | list | length) > 0 %}

      {% if states(entity) not in [''unknown'',''unavailable''] and (domain == "climate" and operation in ["brightness_up","brightness_down"]
      and features | bitwise_and(1) and state_attr(entity,"temperature") is number and state_attr(entity,"min_temp")
      is number and state_attr(entity,"max_temp") is number) | bool %}

      {% set ns.members = ns.members + [entity] %}

      {% set ns.lows = ns.lows + [state_attr(entity,''min_temp'') | float] %}{% set ns.highs = ns.highs + [state_attr(entity,''max_temp'')
      | float] %}

      {% endif %}{% endfor %}{% endif %}

      {% if ns.members | length > 0 %}

      {% set entity = ns.members[0] %}

      {% set lo = ns.lows | max if ns.lows else 0 %}

      {% set hi = ns.highs | min if ns.highs else 0 %}

      {% if lo <= hi %}

      {% set cur = state_attr(entity,''temperature'') | float %}

      {% set value = [lo, [hi, cur + (temperature_step | float * direction | int)] | min] | max %}

      {{ dict(valid=true, members=ns.members, value=value) }}

      {% else %}{{ dict(valid=false, members=ns.members) }}{% endif %}

      {% else %}{{ dict(valid=false, members=[]) }}{% endif %}'
    sync_value: '{% set ns = namespace(members=[], lows=[], highs=[]) %}

      {% if group_mode == ''synchronized'' %}

      {% for entity in targets | unique | list %}

      {% set domain = entity.split(''.'')[0] %}

      {% set features = state_attr(entity,''supported_features'') | int(0) %}

      {% set adjustable = ((state_attr(entity,''supported_color_modes'') or []) | reject(''equalto'',''onoff'')
      | reject(''equalto'',''unknown'') | list | length) > 0 %}

      {% if states(entity) not in [''unknown'',''unavailable''] and (domain in ["number","input_number"] and operation
      in ["brightness_up","brightness_down"] and is_number(states(entity)) and state_attr(entity,"min") is number
      and state_attr(entity,"max") is number) | bool %}

      {% set ns.members = ns.members + [entity] %}

      {% set ns.lows = ns.lows + [state_attr(entity,''min'') | float] %}{% set ns.highs = ns.highs + [state_attr(entity,''max'')
      | float] %}

      {% endif %}{% endfor %}{% endif %}

      {% if ns.members | length > 0 %}

      {% set entity = ns.members[0] %}

      {% set lo = ns.lows | max if ns.lows else 0 %}

      {% set hi = ns.highs | min if ns.highs else 0 %}

      {% if lo <= hi %}

      {% set cur = states(entity) | float %}

      {% set value = [lo, [hi, cur + (numeric_step | float * direction | int)] | min] | max %}

      {{ dict(valid=true, members=ns.members, value=value) }}

      {% else %}{{ dict(valid=false, members=ns.members) }}{% endif %}

      {% else %}{{ dict(valid=false, members=[]) }}{% endif %}'
- repeat:
    for_each: '{{ targets | unique | list }}'
    sequence:
    - variables:
        entity: '{{ repeat.item }}'
        domain: '{{ entity.split(".")[0] }}'
        features: '{{ state_attr(entity,"supported_features") | int(0) }}'
        adjustable: '{{ ((state_attr(entity,"supported_color_modes") or []) | reject("equalto","onoff") | reject("equalto","unknown")
          | list | length) > 0 }}'
    - if: '{{ states(entity) not in ["unknown","unavailable"] }}'
      then:
      - choose:
        - conditions: '{{ (domain == "light" and operation == "on" and is_state(entity,"off")) | bool }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "light" and operation == "off" and is_state(entity,"on")) | bool }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "light" and operation in ["brightness_up","brightness_down"] and adjustable
            and (is_state(entity,"on") or wake_lights)) | bool }}'
          sequence:
          - if: '{{ group_mode == ''synchronized'' }}'
            then:
            - if: '{{ sync_brightness_step_pct.valid and entity in sync_brightness_step_pct.members }}'
              then:
              - action: light.turn_on
                target: &id001
                  entity_id: '{{ entity }}'
                continue_on_error: true
                data:
                  brightness: '{{ sync_brightness_step_pct.value }}'
            else:
            - action: light.turn_on
              target: *id001
              continue_on_error: true
              data:
                brightness_step_pct: '{{ brightness_step | float * direction | int }}'
        - conditions: '{{ (domain == "light" and operation in ["colortemp_up","colortemp_down"] and "color_temp"
            in (state_attr(entity,"supported_color_modes") or []) and state_attr(entity,"min_color_temp_kelvin")
            is number and state_attr(entity,"max_color_temp_kelvin") is number and (is_state(entity,"on") or wake_lights))
            | bool }}'
          sequence:
          - if: '{{ group_mode == ''synchronized'' }}'
            then:
            - if: '{{ sync_color_temp_kelvin.valid and entity in sync_color_temp_kelvin.members }}'
              then:
              - action: light.turn_on
                target: &id002
                  entity_id: '{{ entity }}'
                continue_on_error: true
                data:
                  color_temp_kelvin: '{{ sync_color_temp_kelvin.value }}'
            else:
            - action: light.turn_on
              target: *id002
              continue_on_error: true
              data:
                color_temp_kelvin: '{% set lo = state_attr(entity,''min_color_temp_kelvin'') | float(0) %}

                  {% set hi = state_attr(entity,''max_color_temp_kelvin'') | float(0) %}

                  {% set cur = state_attr(entity,''color_temp_kelvin'') | float(0) %}

                  {% if cur <= 0 %}{% set m = state_attr(entity,''color_temp'') | float(0) %}{% set cur = 1000000
                  / m if m > 0 else (lo+hi)/2 %}{% endif %}

                  {{ [lo, [hi, cur + cct_step | float * direction | int] | min] | max | round(0) | int }}'
        - conditions: '{{ (domain == "media_player" and operation == "on" and features | bitwise_and(16384)) | bool
            }}'
          sequence:
          - action: media_player.media_play
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "media_player" and operation in ["off","stop"] and features | bitwise_and(1))
            | bool }}'
          sequence:
          - action: media_player.media_pause
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "media_player" and operation in ["brightness_up","brightness_down","position_open","position_close"]
            and features | bitwise_and(4) and state_attr(entity,"volume_level") is number) | bool }}'
          sequence:
          - if: '{{ group_mode == ''synchronized'' }}'
            then:
            - if: '{{ sync_volume_level.valid and entity in sync_volume_level.members }}'
              then:
              - action: media_player.volume_set
                target: &id003
                  entity_id: '{{ entity }}'
                continue_on_error: true
                data:
                  volume_level: '{{ sync_volume_level.value }}'
            else:
            - action: media_player.volume_set
              target: *id003
              continue_on_error: true
              data:
                volume_level: '{{ [0, [1, state_attr(entity,"volume_level") + volume_step | float / 100 * direction
                  | int] | min] | max }}'
        - conditions: '{{ (domain == "media_player" and operation in ["colortemp_up","colortemp_down"] and direction
            | int == 1 and features | bitwise_and(32)) | bool }}'
          sequence:
          - action: media_player.media_next_track
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "media_player" and operation in ["colortemp_up","colortemp_down"] and direction
            | int == -1 and features | bitwise_and(16)) | bool }}'
          sequence:
          - action: media_player.media_previous_track
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "cover" and operation == "start" and features | bitwise_and(1)) | bool }}'
          sequence:
          - action: cover.open_cover
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "cover" and operation == "on" and features | bitwise_and(1)) | bool }}'
          sequence:
          - action: cover.open_cover
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "cover" and operation == "off" and hardware_mode != "blue" and features | bitwise_and(2))
            | bool }}'
          sequence:
          - action: cover.close_cover
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "cover" and (operation == "stop" or (operation == "off" and hardware_mode ==
            "blue")) and features | bitwise_and(8)) | bool }}'
          sequence:
          - action: cover.stop_cover
            target:
              entity_id: '{{ entity }}'
            continue_on_error: true
        - conditions: '{{ (domain == "cover" and operation in ["position_open","position_close","brightness_up","brightness_down"]
            and features | bitwise_and(4) and state_attr(entity,"current_position") is number) | bool }}'
          sequence:
          - if: '{{ group_mode == ''synchronized'' }}'
            then:
            - if: '{{ sync_position.valid and entity in sync_position.members }}'
              then:
              - action: cover.set_cover_position
                target: &id004
                  entity_id: '{{ entity }}'
                continue_on_error: true
                data:
                  position: '{{ sync_position.value }}'
            else:
            - action: cover.set_cover_position
              target: *id004
              continue_on_error: true
              data:
                position: '{{ [0, [100, state_attr(entity,"current_position") + cover_step | float * direction |
                  int] | min] | max | round(0) | int }}'
        - conditions: '{{ (domain == "climate" and operation in ["brightness_up","brightness_down"] and features
            | bitwise_and(1) and state_attr(entity,"temperature") is number and state_attr(entity,"min_temp") is
            number and state_attr(entity,"max_temp") is number) | bool }}'
          sequence:
          - if: '{{ group_mode == ''synchronized'' }}'
            then:
            - if: '{{ sync_temperature.valid and entity in sync_temperature.members }}'
              then:
              - action: climate.set_temperature
                target: &id005
                  entity_id: '{{ entity }}'
                continue_on_error: true
                data:
                  temperature: '{{ sync_temperature.value }}'
            else:
            - action: climate.set_temperature
              target: *id005
              continue_on_error: true
              data:
                temperature: '{{ [state_attr(entity,"min_temp"), [state_attr(entity,"max_temp"), state_attr(entity,"temperature")
                  + temperature_step | float * direction | int] | min] | max }}'
        - conditions: '{{ (domain in ["number","input_number"] and operation in ["brightness_up","brightness_down"]
            and is_number(states(entity)) and state_attr(entity,"min") is number and state_attr(entity,"max") is
            number) | bool }}'
          sequence:
          - if: '{{ group_mode == ''synchronized'' }}'
            then:
            - if: '{{ sync_value.valid and entity in sync_value.members }}'
              then:
              - action: '{{ domain }}.set_value'
                target: &id006
                  entity_id: '{{ entity }}'
                continue_on_error: true
                data:
                  value: '{{ sync_value.value }}'
            else:
            - action: '{{ domain }}.set_value'
              target: *id006
              continue_on_error: true
              data:
                value: '{{ [state_attr(entity,"min"), [state_attr(entity,"max"), states(entity) | float + numeric_step
                  | float * direction | int] | min] | max }}'
- delay:
    seconds: !input 'event_cooldown'
