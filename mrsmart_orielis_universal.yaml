  cct_step: '{{ ([b1_cct_step, b2_cct_step, b3_cct_step, b4_cct_step] if hardware_mode == "blue" else [c1_cct_step,
    c2_cct_step, c3_cct_step, c4_cct_step])[channel | int - 1] if channel | int in [1,2,3,4] else 0 }}'
  volume_step: '{{ ([b1_volume_step, b2_volume_step, b3_volume_step, b4_volume_step] if hardware_mode == "blue"
